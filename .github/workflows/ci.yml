name: CI

# Run on every push to any branch, on pull requests, and on demand.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Pylint and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pylint
        id: pylint
        run: pylint $(git ls-files '*.py')

      # Run the tests even when Pylint fails, so each run reports both checks.
      - name: Run pytest
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -v

      - name: Report results
        if: ${{ always() }}
        run: |
          {
            echo "## CI results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | ${{ steps.install.outcome }} |"
            echo "| Pylint | ${{ steps.pylint.outcome }} |"
            echo "| pytest | ${{ steps.pytest.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
