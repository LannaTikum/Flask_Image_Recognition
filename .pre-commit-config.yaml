# Pre-commit hooks for this project.
# Setup (once per clone):  pip install -r requirements-dev.txt && pre-commit install
# Run on everything:       pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3

repos:
  # Fast, generic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Project tools run from the active virtual environment, so the hooks use
  # exactly the pinned versions in requirements-dev.txt (same as CI).
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: ["-rn", "-sn"]  # messages only, no report or score
        require_serial: true

      - id: pytest
        name: pytest (on push)
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
